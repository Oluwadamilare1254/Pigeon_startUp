<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Email verification</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='email.css'>
    <script src='email.js' defer></script>
</head>

<body>
    <header>

        <div class="logo">
            <img src="./Assets/PIGEON SMALL.svg" alt="">
        </div>
    </header>
    <form action="">
        <div class="num-email">
            <label for="email">What's your email?</label>
            <div class="email-container">
                <input id='email' type="email" name="email" required>
            </div>
            <button id="#numberLink"><a class="link" href="signup.html">Use number instead</a></button>
        </div>

        <div class="bottom-container">
            <button type="button" id="emailSubmit">Continue</button>
            <h3><a href="">I already have an account</a></h3>
        </div>
    </form>
</body>

</html>
