<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Sign Up</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='./signup.css'>
    <script src='main.js'></script>
</head>
<body>
    <header>   
        <h1>PIGEON</h1>
    </header>
    <form class="num-email">
        <h2>What's your number?</h2>
        <div class="number-container">
            <div class="country-flag"></div>
                <input type="tel" placeholder="+234" pattern="[0-9]{3}-[0-9]{2}[0-9]{3}" autofocus>      
        </div>
        <button><a href="email.html">Use email instead</a></button>
    </form>

    <div class="bottom-container">
        <button>Continue</button>
        <h3><a href="">I already have an account</a></h3>
    </div>
</body>
</html>
