<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Create an account</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='create.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <script src="./create.js" defer></script>
</head>

<body>
    <header>
        <div class="pigeon-logo">
        <img src="./Assets/PIGEON BIG.svg" alt="">
        </div>
    </header>

    <div class="create-section">
        <div class="middle">
            <h2 id="dynamicText">Create an account</h2>
            <form novalidate id="refresh">
                <div class="username">
                    <input type="text" name="username" placeholder="username" id="username" required>
                    <p id="username-message" aria-live="polite">Only use letters, numbers, underscores and periods.</p>
                </div>
                <div class="password">
                    <div class="password-container">
                        <input type="password" placeholder="password" id="password" minlength='8' maxlength="16"
                            required>
                            <div class="hide-img">
                        <img  src='./Assets/eye-closed-svgrepo-com.svg'id="passwordBtn" alt="view-password">
                        </div>

                    </div>
                    <p id="password-message" aria-live="polite">Passwords must be 8 or more characters.</p>
                </div>
        </div>
        <div class="botton-container">
            <button type="submit" id="nextBtn">Next</button>
        </div>
        </form>
    </div>
</body>

</html>
