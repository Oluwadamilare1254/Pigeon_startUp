<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Create an account</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='create.css'>
    <script defer src="./create.js"></script>
</head>

<body>
    <header>
        <h1>PIGEON</h1>
    </header>

    <div class="create-section">
        <h2>Create an account</h2>
        <form novalidate id="refresh">
            <div class="username">
                <input type="text" placeholder="username" id="username" required>
                <p id="username-message" aria-live="polite">Only use letters, numbers, underscores and periods.</p>
            </div>
            <div class="password">
                <div class="password-container">
                    <input type="password" placeholder="password" id="password" minlength ='8'  maxlength="16" required>
                    <button id="passwordBtn">Show</button>

                </div>
                <p id="password-message" aria-live="polite">Passwords must be 8 or more characters.</p>
            </div>
            <div class="botton-container">
            <button type="submit" id="nextBtn">Next</button>
            </div>
        </form>
    </div>
</body>

</html>
