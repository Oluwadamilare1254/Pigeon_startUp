<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Market Structure</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='./marketStructure.css'>
    <!-- <script src='main.js'></script> -->
</head>

<body>
    <article>
        <div class="title-image">
            <div class="img-container">
                <img src="./Assets/background.jpg" alt="">
            </div>
            <p>Will Davido drop an Album in 2026?</p>
        </div>
        <div class="category">
            <div class="logo-category">
                <div>🥷</div>
                <p>Culture - Afro beats</p>
            </div>
            <div class="date">
                <span type="date">31/12/26</span>
            </div>
        </div>
        <div class="prediction">
            <div class="yes-section">
                <h1>Yes</h1>
                <div class="value">
                    <span>₦59</span>
                    <div>•</div>
                    <span>59%</span>
                    <div>°</div>
                </div>
            </div>
            <div class="yes-section">
                <h1>No</h1>
                <div class="value">
                    <span>₦59</span>
                    <div>•</div>
                    <span>59%</span>
                    <div>°</div>
                </div>
            </div>
            <div class="overview">
                <div class="volume">
                    <div>👑</div>
                    <span>₦46,357,211</span>
                </div>
                <span class="details"><a href="">Full details</a></span>
            </div>
        </div>
    </article>
</body>

</html>
